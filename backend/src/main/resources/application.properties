spring.application.name=log-analyzer-backend
server.port=8080

# Upload limits. ApiExceptionHandler reports max-file-size back to the user when exceeded.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Comma-separated origins allowed to call /api/** (the Vite dev server by default).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
